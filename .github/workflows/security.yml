name: Security scan

# Reusable workflow. Scans the staging SWR image with Grype and Trivy.
# Both scanners BLOCK the pipeline on HIGH or CRITICAL findings (no continue-on-error),
# so a failing scan prevents the downstream publish job from running.
on:
  workflow_call:
    inputs:
      image_name:
        description: "Full staging image name to scan"
        required: true
        type: string
      swr_registry:
        description: "Registry hostname (for login)"
        required: true
        type: string

jobs:
  grype_scan:
    runs-on: ubuntu-24.04
    # Runs in parallel with trivy_scan. No continue-on-error: a HIGH/CRITICAL fails the job.
    steps:
      - name: Mask sensitive values
        run: echo "::add-mask::${{ inputs.image_name }}"

      - name: Log in to Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ inputs.swr_registry }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Scan image with Grype
        uses: anchore/scan-action@v7.4.0
        id: grype
        with:
          image: ${{ inputs.image_name }}
          # Report first, then fail explicitly in the next step so the package
          # table is always printed even when findings block the build.
          fail-build: false
          severity-cutoff: high
          output-format: json

      - name: Report Grype HIGH/CRITICAL findings
        run: |
          report='${{ steps.grype.outputs.json }}'
          filter='.matches[]? | select((.vulnerability.severity | ascii_upcase) == "HIGH" or (.vulnerability.severity | ascii_upcase) == "CRITICAL")'
          count=$(jq "[$filter] | length" "$report")
          {
            echo "## Grype: $count HIGH/CRITICAL vulnerabilities"
            echo ""
            echo "| Severity | Package | Installed | Fixed in | Vulnerability |"
            echo "|----------|---------|-----------|----------|---------------|"
            jq -r "$filter | \"| \(.vulnerability.severity) | \(.artifact.name) | \(.artifact.version) | \((.vulnerability.fix.versions // []) | join(\", \") | if . == \"\" then \"-\" else . end) | \(.vulnerability.id) |\"" "$report"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error::Grype found $count HIGH/CRITICAL vulnerabilities"
            exit 1
          fi

  trivy_scan:
    runs-on: ubuntu-24.04
    # Runs in parallel with grype_scan. No continue-on-error: a HIGH/CRITICAL fails the job.
    steps:
      - name: Mask sensitive values
        run: echo "::add-mask::${{ inputs.image_name }}"

      - name: Log in to Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ inputs.swr_registry }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image_name }}
          scanners: vuln
          severity: HIGH,CRITICAL
          # Report first, then fail explicitly in the next step so the package
          # table is always printed even when findings block the build.
          exit-code: '0'
          ignore-unfixed: true
          format: json
          output: trivy-results.json

      - name: Report Trivy HIGH/CRITICAL findings
        run: |
          report=trivy-results.json
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$report")
          {
            echo "## Trivy: $count HIGH/CRITICAL vulnerabilities"
            echo ""
            echo "| Severity | Package | Installed | Fixed in | Vulnerability |"
            echo "|----------|---------|-----------|----------|---------------|"
            jq -r '.Results[]?.Vulnerabilities[]? | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \(.VulnerabilityID) |"' "$report"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error::Trivy found $count HIGH/CRITICAL vulnerabilities"
            exit 1
          fi
