name: Rename Image

on:
  workflow_call: # ← explicitly marks it as reusable
    inputs:
      image_name:
        description: "The staging image name from build_image"
        required: true
        type: string
    outputs:
      final_image_name:
        description: "The promoted image name without the -staging suffix"
        value: ${{ jobs.rename_image.outputs.final_image_name }}
      
jobs:
  rename_image:
    runs-on: ubuntu-latest
    
    environment: production-approval
    # GitHub equivalent of GitLab's when: manual
    # requires a human reviewer to approve before this job runs
    outputs:
      final_image_name: ${{ steps.promote.outputs.final_image_name }}
    
    steps:
      - name: Strip staging suffix from image name
        # GitLab: export FINAL_IMAGE_NAME="${{STAGING_IMAGE_NAME%-staging}}"
        id: promote
        run: |
          SOURCE_IMAGE="${{ inputs.image_name }}"
          FINAL_IMAGE_NAME="${SOURCE_IMAGE%-staging}"
          echo "Promoting $FINAL_IMAGE_NAME"
          echo "final_image_name=$FINAL_IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Promote image in Harbor with Skopeo
        # GitLab: skopeo copy --src-creds ... ---dest-creds ... docker://$SOURCE_IMAGE docker://$FINAL_IMAGE_NAME
        run: |
          SOURCE_IMAGE="${{ inputs.image_name }}"
          FINAL_IMAGE_NAME="${{ steps.promote.outputs.final_image_name }}"  
          docker run --rm \
            quay.io/containers/skopeo:latest \
            copy \
            --src-creds "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            --dest-creds "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            docker://$SOURCE_IMAGE \
            docker://$FINAL_IMAGE_NAME
