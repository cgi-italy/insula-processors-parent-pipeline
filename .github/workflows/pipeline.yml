name: CI Pipeline

on:
  workflow_call:
  

jobs:
  scan_secrets:
    uses: ./.github/workflows/scan_secrets.yml
    secrets: inherit

  build_image:
    needs: [scan_secrets]
    uses: ./.github/workflows/build_image.yml
    secrets: inherit

  security:
    needs: [build_image]
    uses: ./.github/workflows/security.yml
    with:
      image_name: ${{ needs.build_image.outputs.image_name }}
    secrets: inherit





    
    
  