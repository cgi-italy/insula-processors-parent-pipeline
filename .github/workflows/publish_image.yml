name: Publish Image

# Reusable workflow. Promotes a scanned staging image to the published SWR
# namespace as :latest. Called automatically by pipeline.yml only after the
# secret scan and both security scans have passed. No manual approval gate.
on:
  workflow_call:
    inputs:
      image_name:
        description: "Full staging image name to promote (with :sha8 tag)"
        required: true
        type: string
      swr_prod_org:
        description: "Namespace for published images"
        required: true
        type: string

jobs:
  publish_image:
    runs-on: ubuntu-24.04
    steps:
      - name: Mask sensitive values
        run: echo "::add-mask::${{ inputs.image_name }}"

      - name: Resolve published image name
        id: target
        run: |
          # Staging:   <registry>/<staging-org>/<app>:<sha8>
          # Published: <registry>/<prod-org>/<app>:latest
          # Registry is taken from the staging image name (first path segment).
          REPO="${{ github.repository }}"
          APP_NAME="${REPO##*/}"
          SRC="${{ inputs.image_name }}"
          REGISTRY="${SRC%%/*}"
          TARGET="${REGISTRY}/${{ inputs.swr_prod_org }}/${APP_NAME}:latest"
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Promote staging image to published :latest with Skopeo
        # SWR speaks the Docker Registry v2 API, so skopeo copy works across
        # namespaces without pulling the image through the runner filesystem.
        run: |
          docker run --rm \
            quay.io/skopeo/stable:v1.23.0 \
            copy \
            --src-creds '${{ secrets.SWR_USERNAME }}:${{ secrets.SWR_PASSWORD }}' \
            --dest-creds '${{ secrets.SWR_USERNAME }}:${{ secrets.SWR_PASSWORD }}' \
            docker://${{ inputs.image_name }} \
            docker://${{ steps.target.outputs.target }}
