name: Publish Image

# Reusable workflow. Promotes a scanned staging image to the published SWR
# namespace as :latest and, when the source carries one, an immutable :sha8
# tag. Called automatically by the launcher's build-external.yml only after the
# secret scan and both security scans have passed. No manual approval gate.
on:
  workflow_call:
    inputs:
      image_name:
        description: "Full staging image name to promote (with :sha8 tag)"
        required: true
        type: string
      swr_prod_org:
        description: "Namespace for published images"
        required: true
        type: string
      app_name:
        description: "Image app name (owner-name)"
        required: true
        type: string
    outputs:
      published_image:
        description: "Immutable published image ref (:sha8 when available, else :latest)"
        value: ${{ jobs.publish_image.outputs.published_image }}

# No checkout and no GITHUB_TOKEN use here (publish uses the SWR secrets), so deny
# the token entirely.
permissions: {}

jobs:
  publish_image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # SWR promote credentials live in this Environment (default-branch-only rule).
    environment: swr
    outputs:
      published_image: ${{ steps.target.outputs.published_image }}
    steps:
      - name: Resolve published image names
        id: target
        # image_name/app_name reach the shell via env and are referenced as $VARS,
        # never inline ${{ }}, so no value can be substituted into the script.
        env:
          APP_NAME_IN: ${{ inputs.app_name }}
          IMAGE: ${{ inputs.image_name }}
          SWR_PROD_ORG: ${{ inputs.swr_prod_org }}
        run: |
          # Staging:   <registry>/<staging-org>/<app>:<sha8>
          # Published: <registry>/<prod-org>/<app>:latest   (moving tag)
          #            <registry>/<prod-org>/<app>:<sha8>    (immutable tag)
          # Registry is taken from the staging image name (first path segment).
          # SWR host carries no port, so the source tag is the part after the
          # last colon.
          # Lowercased because registry repository names must be lowercase.
          APP_NAME="$(printf '%s' "$APP_NAME_IN" | tr '[:upper:]' '[:lower:]')"
          # Reject anything outside the lowercase registry-path charset (the caller
          # validates too; this is defence in depth).
          case "$APP_NAME" in
            [a-z0-9]*) : ;;
            *) echo "::error::app name must start with a lowercase alphanumeric"; exit 1 ;;
          esac
          case "$APP_NAME" in
            *[!a-z0-9._-]*) echo "::error::app name has invalid characters"; exit 1 ;;
          esac
          SRC="$IMAGE"
          REGISTRY="${SRC%%/*}"
          BASE="${REGISTRY}/${SWR_PROD_ORG}/${APP_NAME}"
          echo "target_latest=${BASE}:latest" >> "$GITHUB_OUTPUT"

          # Only expose a sha target when the source actually carries a tag that
          # is not itself "latest".
          SHA_TAG="${SRC##*:}"
          if [ "$SHA_TAG" != "$SRC" ] && [ "$SHA_TAG" != "latest" ]; then
            echo "target_sha=${BASE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
            echo "published_image=${BASE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "target_sha=" >> "$GITHUB_OUTPUT"
            echo "published_image=${BASE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote staging image to published tags with Skopeo
        # SWR speaks the Docker Registry v2 API, so skopeo copy works across
        # namespaces without pulling the image through the runner filesystem.
        # Copy the immutable :sha8 tag FIRST, then move :latest: on a partial
        # failure :latest must never point at a build that has no matching
        # immutable :sha8 to trace it back to.
        # Credentials are written to mounted authfiles, never passed on the skopeo
        # argv (where they would be visible in the container process list). Two
        # credentials on purpose (least privilege): the STAGING one reads and
        # deletes eopaas-test and is the only SWR credential the earlier untrusted
        # build job ever sees; the PROD-write one exists ONLY in this job, as the
        # skopeo copy destination. The skopeo image is digest-pinned to the
        # IMMUTABLE tag v1.22.3-immutable; bump the digest by hand and only ever
        # from a *-immutable tag. quay.io garbage-collects untagged manifests, so
        # a digest taken from a moving tag (latest, v1, v1.22, v1.22.3) dies the
        # next time that tag is rebuilt and breaks every publish.
        env:
          IMAGE: ${{ inputs.image_name }}
          TARGET_LATEST: ${{ steps.target.outputs.target_latest }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          SWR_STAGING_USERNAME: ${{ secrets.SWR_STAGING_USERNAME }}
          SWR_STAGING_PASSWORD: ${{ secrets.SWR_STAGING_PASSWORD }}
          SWR_PROD_USERNAME: ${{ secrets.SWR_PROD_USERNAME }}
          SWR_PROD_PASSWORD: ${{ secrets.SWR_PROD_PASSWORD }}
        run: |
          SKOPEO="quay.io/skopeo/stable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5"
          REGISTRY="${IMAGE%%/*}"
          AUTH_DIR="$(mktemp -d)"
          B64_STAGING="$(printf '%s:%s' "$SWR_STAGING_USERNAME" "$SWR_STAGING_PASSWORD" | base64 -w0)"
          echo "::add-mask::$B64_STAGING"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$B64_STAGING" > "$AUTH_DIR/staging.json"
          B64_PROD="$(printf '%s:%s' "$SWR_PROD_USERNAME" "$SWR_PROD_PASSWORD" | base64 -w0)"
          echo "::add-mask::$B64_PROD"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$B64_PROD" > "$AUTH_DIR/prod.json"
          # Pull the pinned skopeo image with retries: an anonymous quay.io pull can
          # be throttled/blip, and a failed pull would otherwise fail the publish.
          n=0
          until docker pull "$SKOPEO"; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "::error::could not pull skopeo image"; exit 1; }
            sleep $((n*10))
          done
          # copy with skopeo's own --retry-times (in-call) plus an outer retry for
          # process-level transients. Fails the job after retries (never masked).
          # Source (staging read) and destination (prod write) use separate
          # authfiles; both target the same SWR host, which is fine because skopeo
          # resolves source and destination credentials independently.
          copy() {
            m=0
            until docker run --rm -v "$AUTH_DIR:/auth:ro" "$SKOPEO" \
                copy --src-authfile /auth/staging.json --dest-authfile /auth/prod.json \
                --retry-times 3 \
                "docker://$IMAGE" "docker://$1"; do
              m=$((m+1))
              if [ "$m" -ge 3 ]; then
                # Two credentials, two owners: say which side to suspect instead
                # of leaving the operator to decode raw skopeo stderr.
                echo "::error::skopeo copy to $1 failed after retries; if the error names the SOURCE ($IMAGE) check SWR_STAGING_*, if the DESTINATION ($1) check SWR_PROD_*; dispatch registry-canary to confirm logins"
                return 1
              fi
              sleep $((m*5))
            done
          }
          # Idempotent re-run guard. The successful path below DELETES this run's
          # staging :sha8 (retention), so a replayed publish ("Re-run jobs") has no
          # copy SOURCE and skopeo would fail 'manifest unknown'. If the staging
          # source is gone BUT the prod target already exists, the publish already
          # succeeded: treat the replay as a no-op success. If both are gone, the
          # image genuinely must be rebuilt (re-run build_image).
          exists() { docker run --rm -v "$AUTH_DIR:/auth:ro" "$SKOPEO" inspect --authfile "$1" "docker://$2" >/dev/null 2>&1; }
          if ! exists /auth/staging.json "$IMAGE"; then
            CHECK="${TARGET_SHA:-$TARGET_LATEST}"
            if exists /auth/prod.json "$CHECK"; then
              echo "::notice::staging source $IMAGE already promoted (prod $CHECK exists); re-run no-op"
              exit 0
            fi
            echo "::error::staging source $IMAGE is gone and not yet published; re-run build_image to rebuild it"
            exit 1
          fi
          if [ -n "$TARGET_SHA" ]; then
            copy "$TARGET_SHA"
          fi
          copy "$TARGET_LATEST"
          # Publish succeeded: drop THIS run's staging tag from eopaas-test. Only this
          # :sha8 - never all tags (concurrent builds of the same app push their own
          # :sha8 to staging). Best-effort: a cleanup failure must NOT fail an
          # already-successful publish (this is not the scan/publish gate).
          if docker run --rm -v "$AUTH_DIR:/auth:ro" "$SKOPEO" \
               delete --authfile /auth/staging.json "docker://$IMAGE"; then
            echo "Removed staging image $IMAGE"
          else
            echo "::warning::could not remove staging image $IMAGE (publish OK); prune eopaas-test manually if it grows"
            # Also record it in the run summary: a lost SWR_STAGING delete scope would
            # otherwise degrade eopaas-test silently (warnings scroll past) until pushes
            # or quota start failing.
            echo "- staging cleanup FAILED for \`$IMAGE\` (publish succeeded); check the SWR_STAGING delete scope" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report published image
        # Surface the published paths so the caller can POST them to the
        # consuming service. Emitted to the job summary and as workflow notices.
        env:
          TARGET_LATEST: ${{ steps.target.outputs.target_latest }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          # Report only <app>:<tag>, not the full registry/namespace path.
          LATEST="${TARGET_LATEST##*/}"
          SHA=""
          [ -n "$TARGET_SHA" ] && SHA="${TARGET_SHA##*/}"
          {
            echo "## Published image"
            echo ""
            echo '```'
            echo "$LATEST"
            [ -n "$SHA" ] && echo "$SHA"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Published image (latest)::$LATEST"
          # if-guard, not a bare AND-list: as the step's LAST command, a failing
          # [ -n ] would set the step exit status to 1 and fail a successful
          # publish on the no-:sha8 path.
          if [ -n "$SHA" ]; then
            echo "::notice title=Published image (sha)::$SHA"
          fi
