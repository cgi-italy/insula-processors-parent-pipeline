name: Publish Image

on:
  workflow_call:
    inputs:
      final_image_name:
        description: "The approved Harbor image name to publish (no -staging suffix)"
        required: true
        type: string

jobs:
  publish_to_open_registry:
    runs-on:  ubuntu-latest
    
    environment: publish-approval
    # GitHub equivalent of GitLab's when: manual
    # second manual gate before publishing externally
    
    steps:
      - name: Compute destination image paths
        # GitLab: strips HARBOR_REGISTRY/HARBOR_PROJECT prefix to get IMAGE_PATH
        id: paths
        run: |
          FINAL_IMAGE_NAME="${{ inputs.final_image_name }}"
          HARBOR_REGISTRY="${{ vars.HARBOR_REGISTRY }}"
          HARBOR_PROJECT="${{ vars.HARBOR_PROJECT }}"
          IMAGE_PATH="${FINAL_IMAGE_NAME#$HARBOR_REGISTRY/$HARBOR_PROJECT/}"
          echo "IMAGE_PATH=$IMAGE_PATH"
          echo "image_path=$IMAGE_PATH" >> $GITHUB_OUTPUT
    
      - name: Push versioned image to OpenRegistry
        # GitLab: skopeo copy ... docker://$FINAL_IMAGE_NAME docker://$DEST_IMAGE
        run: |
          FINAL_IMAGE_NAME="${{ inputs.final_image_name }}"
          IMAGE_PATH="${{ steps.paths.outputs.image_path }}"
          DEST_IMAGE="${{ vars.OPENREGISTRY_URL }}/$IMAGE_PATH"
          echo "Tagging image for export in final repo: $DEST_IMAGE"
          docker run --rm \
            quay.io/containers/skopeo:latest \
            copy \
            --src-creds '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            --dest-creds '${{ secrets.OPENREGISTRY_USERNAME }}:${{ secrets.OPENREGISTRY_PASSWORD }}' \
            --dest-registry-token "" \
            docker://$FINAL_IMAGE_NAME \
            docker://$DEST_IMAGE

      - name: Push latest tag to OpenRegistry
        # GitLab: strips tag, appends :latest, copies agian
        run: |
          FINAL_IMAGE_NAME="${{ inputs.final_image_name }}"
          IMAGE_PATH="${{ steps.paths.outputs.image_path }}"
          IMAGE_PATH_LATEST="${IMAGE_PATH%:*}:latest"
          DEST_IMAGE_LATEST="${{ vars.OPENREGISTRY_URL }}/$IMAGE_PATH_LATEST"
          echo "Tagging image latest for export in final repo: $DEST_IMAGE_LATEST"
          docker run --rm \
            quay.io/containers/skopeo:latest \
            copy \
            --src-creds '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            --dest-creds '${{ secrets.OPENREGISTRY_USERNAME }}:${{ secrets.OPENREGISTRY_PASSWORD }}' \
            --dest-registry-token "" \
            docker://$FINAL_IMAGE_NAME \
            docker://$DEST_IMAGE_LATEST