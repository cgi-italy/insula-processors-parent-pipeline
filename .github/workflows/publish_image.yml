name: Publish Image

on:
  workflow_call:
    inputs:
      image_name:
        description: "The test image to promote to production"
        required: true
        type: string

jobs:
  publish_to_open_registry:
    runs-on:  ubuntu-latest
    
    environment: publish-approval
    # GitHub equivalent of GitLab's when: manual
    # second manual gate before publishing externally
    
    steps:
      - name: Compute destination image paths
        # GitLab: strips HARBOR_REGISTRY/HARBOR_PROJECT prefix to get IMAGE_PATH
        id: paths
        run: |
          SOURCE_IMAGE="${{ inputs.image_name }}"
          HARBOR_REGISTRY="${{ vars.HARBOR_REGISTRY }}"
          HARBOR_PROJECT="${{ vars.HARBOR_PROJECT }}"
          HARBOR_PROD_PROJECT="${{ vars.HARBOR_PROD_PROJECT }}"
          REMAINDER="${SOURCE_IMAGE#$HARBOR_REGISTRY/$HARBOR_PROJECT/test/}"
          DEST_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROD_PROJECT/prod/$REMAINDER"
          DEST_IMAGE_LATEST="${DEST_IMAGE%:*}:latest"
          echo "dest_image=$DEST_IMAGE" >> $GITHUB_OUTPUT
          echo "dest_image_latest=$DEST_IMAGE_LATEST" >> $GITHUB_OUTPUT
    
      - name: Push versioned image to OpenRegistry
        # GitLab: skopeo copy ... docker://$FINAL_IMAGE_NAME docker://$DEST_IMAGE
        run: |
          docker run --rm \
            quay.io/containers/skopeo:latest \
            copy \
            --src-creds '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            --dest-creds '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            docker://${{ inputs.image_name }} \
            docker://${{ steps.paths.outputs.dest_image }}

      - name: Push latest tag to OpenRegistry
        # GitLab: strips tag, appends :latest, copies agian
        run: |
          docker run --rm \
            quay.io/containers/skopeo:latest \
            copy \
            --src-creds '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            --dest-creds '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            docker://${{ inputs.image_name }} \
            docker://${{ steps.paths.outputs.dest_image_latest }}
