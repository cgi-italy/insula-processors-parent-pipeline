name: Publish Image

on:
  workflow_call:
    inputs:
      image_name:
        description: "The test image to promote to production"
        required: true
        type: string

jobs:
  publish_to_harbor:
    runs-on: ubuntu-latest
    
    environment: publish-approval
    # GitHub equivalent of GitLab's when: manual
    # second manual gate before publishing externally

    steps:
      - name: Mask sensitive values
        run: echo "::add-mask::${{ inputs.image_name }}"

      - name: Copy versioned image to Prod via Harbor API
        # Harbor server-side copy - no image traffic through runner
        run: |
          REPO="${{ github.repository }}"
          APP_NAME="${REPO##*/}"
          TAG="${{ inputs.image_name }}"
          TAG="${TAG##*:}"
          curl -s -X POST \
            -u '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            "https://${{ vars.HARBOR_REGISTRY }}/api/v2.0/projects/${{ vars.HARBOR_PROD_PROJECT }}/repositories/prod%252F${APP_NAME}/artifacts?from=${{ vars.HARBOR_PROJECT }}%2Ftest%2F${APP_NAME}%3A${TAG}" \
            -H 'accept: application/json'

      - name: Tag copied image as latest via Harbor API
        run: |
          REPO="${{ github.repository }}"
          APP_NAME="${REPO##*/}"
          TAG="${{ inputs.image_name }}"
          TAG="${TAG##*:}"
          curl -s -X DELETE \
            -u '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            "https://${{ vars.HARBOR_REGISTRY }}/api/v2.0/projects/${{ vars.HARBOR_PROD_PROJECT }}/repositories/prod%252F${APP_NAME}/artifacts/latest/tags/latest" \
            -H 'accept: application/json' || true
          curl -s -X POST \
            -u '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            "https://${{ vars.HARBOR_REGISTRY }}/api/v2.0/projects/${{ vars.HARBOR_PROD_PROJECT }}/repositories/prod%252F${APP_NAME}/artifacts/${TAG}/tags" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -d '{"name":"latest"}'

