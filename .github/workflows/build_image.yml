name: Build Image

# Reusable workflow. Builds code/Dockerfile with Buildx and pushes a staging
# image to OTC SWR. Non-secret config (registries, namespace) is passed in as
# `with:` inputs from the launcher's build-external.yml orchestrator.
on:
  workflow_call:
    inputs:
      swr_registry:
        description: "OTC SWR registry hostname"
        required: true
        type: string
      swr_staging_org:
        description: "SWR namespace for staging images"
        required: true
        type: string
      base_registry:
        description: "Registry that hosts the Dockerfile base image (pull only)"
        required: true
        type: string
      repo_slug:
        description: "External processor repo (owner/name) to build"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA) of the external repo to build"
        required: false
        default: ""
        type: string
      app_name:
        description: "Image app name (owner-name)"
        required: true
        type: string
      source_path:
        description: "Path (relative to repo root) holding the Dockerfile and build context"
        required: false
        default: "code"
        type: string
    outputs:
      image_name:
        description: "Full SWR staging image name that was pushed (with :sha8 tag)"
        value: ${{ jobs.build_image.outputs.image_name }}

# Deny GITHUB_TOKEN by default; the job re-grants only contents:read for checkout.
permissions: {}

jobs:
  build_image:
    runs-on: ubuntu-24.04
    # Untrusted Dockerfile build: cap it so a hung/wedged build cannot hold a runner
    # (and the concurrency slot) for the 6h GitHub default.
    timeout-minutes: 60
    permissions:
      contents: read
    # Registry secrets live in this Environment, whose deployment-branch rule
    # (default branch only) blocks a side-branch dispatch from reading them.
    environment: swr
    outputs:
      image_name: ${{ steps.set_image_name.outputs.image_name }}

    steps:
      - name: Checkout the processor repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.ref }}

      - name: Set image name
        id: set_image_name
        # app_name reaches the shell via env and is referenced as $VAR, never inline
        # ${{ }}, so no value can be substituted into the script before it runs.
        env:
          APP_NAME_IN: ${{ inputs.app_name }}
          SWR_REGISTRY: ${{ inputs.swr_registry }}
          SWR_STAGING_ORG: ${{ inputs.swr_staging_org }}
        run: |
          # Lowercased because registry repository names must be lowercase.
          APP_NAME="$(printf '%s' "$APP_NAME_IN" | tr '[:upper:]' '[:lower:]')"
          # Reject anything outside the lowercase registry-path charset (the caller
          # validates too; this is defence in depth).
          case "$APP_NAME" in
            [a-z0-9]*) : ;;
            *) echo "::error::app name must start with a lowercase alphanumeric"; exit 1 ;;
          esac
          case "$APP_NAME" in
            *[!a-z0-9._-]*) echo "::error::app name has invalid characters"; exit 1 ;;
          esac
          # Staging tag = first 8 chars of the checked-out external repo HEAD.
          TAG="$(git rev-parse HEAD | cut -c1-8)"
          IMAGE_NAME="${SWR_REGISTRY}/${SWR_STAGING_ORG}/${APP_NAME}:${TAG}"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Check Dockerfile exists
        # Hard stop: fail immediately if the repo has no Dockerfile under source_path.
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          if [ -f "${GITHUB_WORKSPACE}/${SOURCE_PATH}/Dockerfile" ]; then
            echo "Dockerfile found!"
          else
            echo "Dockerfile not found under ${SOURCE_PATH}/!"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to base image registry
        # The Dockerfile FROM pulls the base image from the internal Registry. Retry the
        # login (matching the scan/publish retry idiom) so a transient blip does not
        # fail an otherwise-clean build; password via stdin, never on argv. Secret
        # values are auto-masked by GitHub in logs.
        env:
          REG: ${{ inputs.base_registry }}
          U: ${{ secrets.BASE_REGISTRY_USERNAME }}
          P: ${{ secrets.BASE_REGISTRY_PASSWORD }}
        run: |
          n=0
          until printf '%s' "$P" | docker login "$REG" -u "$U" --password-stdin; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "::error::login to base registry $REG failed after retries"; exit 1; }
            sleep $((n*5))
          done

      - name: Log in to remote registry
        # AK/SK long-term login key. Username format: <region>@<AK>, e.g. eu-de@AK.
        # STAGING credential on purpose: this job executes an untrusted Dockerfile,
        # so it must never hold a credential that can write the published (prod)
        # namespace. Prod-write creds exist only in publish_image.yml. Retried;
        # password via stdin, never on argv.
        env:
          REG: ${{ inputs.swr_registry }}
          U: ${{ secrets.SWR_STAGING_USERNAME }}
          P: ${{ secrets.SWR_STAGING_PASSWORD }}
        run: |
          n=0
          until printf '%s' "$P" | docker login "$REG" -u "$U" --password-stdin; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "::error::login to SWR $REG failed after retries"; exit 1; }
            sleep $((n*5))
          done

      - name: Build and push staging image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ inputs.source_path }}
          file: ./${{ inputs.source_path }}/Dockerfile
          push: true
          tags: ${{ steps.set_image_name.outputs.image_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SWR rejects the OCI image index that Buildx attestations produce
          # ("Invalid image, fail to parse manifest.json"). Disable provenance
          # and SBOM so a single Docker schema2 manifest is pushed instead.
          provenance: false
          sbom: false
