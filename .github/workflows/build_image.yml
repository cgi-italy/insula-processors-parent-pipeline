name: Build Image

on:
  workflow_call: # ← explicitly marks it as reusable

    # Exposes image_name output so downstream jobs (security, rename, publish)
    # know which Harbor image to scan, rename and publish

    outputs:
      image_name:
        description: "the full Harbor image name with staging tag"
        value: ${{ jobs.build_image.outputs.image_name }}

jobs:
  build_image:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.set_image_name.outputs.image_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ← checks out the child repo code onto the ubuntu runner

      - name: Set image name
        id: set_image_name
        run: |
           # Extract repository components from github.repository
           # github.repository = "org-name/eumon_test"
           REPO="${{ github.repository }}"
           APP_NAME="${REPO##*/}"
           echo "APP_NAME=$APP_NAME"
           TENANT_NAME="${{ vars.TENANT_NAME }}"
           echo "TENANT_NAME=$TENANT_NAME"
           # Build staging tag from full SHA trimmed to 8 chars
           # GitLab: $CI_COMMIT_SHORT_SHA is already 8 chars
           # GitHub: ${{ github.sha }} is full 40 chars so we trim it to 8 chars
           STAGING_TAG="${{ github.sha }}"
           STAGING_TAG="${STAGING_TAG:0:8}-staging"
           echo "STAGING_TAG=$STAGING_TAG"
           # Build full image name - same structure as GitLab
           # GitLab: IMAGE_NAME="$HARBOR_REGISTRY/$HARBOR_PROJECT/$TENANT_NAME/$TENANT_NAME/$APP_NAME:$STAGING_TAG"
           HARBOR_REGISTRY="${{ vars.HARBOR_REGISTRY }}"
           HARBOR_PROJECT="${{ vars.HARBOR_PROJECT }}"
           IMAGE_PREFIX="$TENANT_NAME/$TENANT_NAME/$APP_NAME"
           IMAGE_NAME="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_PREFIX:$STAGING_TAG"
           echo "IMAGE_NAME=$IMAGE_NAME"
           # Set the output so downstream jobs can read IMAGE_NAME
           # GitLab: echo "IMAGE_NAME=$IMAGE_NAME" > image.env (dotenv artifact)
           # GitHub: echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
           echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: check Dockerfile exists
        # GitLab: if [ -f "Dockerfile"]; then echo "Dockerfile exists"; else exit 1; fi
        # Hard stop - pipeline fails immediately if Dockerfile is missing
        run: |
          if [ -f "${{ github.workspace }}/code/Dockerfile" ]; then
            echo "Dockerfile found!"
          else
            echo "Dockerfile not found!"
            exit 1
          fi
        
      - name: Authenticate to Harbor
        run: |
          mkdir -p /kaniko/.docker
          echo '${{ secrets.DOCKER_AUTH_CONFIG }}' > /kaniko/.docker/config.json

      
      
      - name: Build and push image with Kaniko
        # GitLab: ran entire job inside kaniko container
        # GitHub: run kaniko as a docker container inside ubuntu runner
        run: |
          IMAGE_NAME="${{ steps.set_image_name.outputs.image_name }}"
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v /kaniko/.docker/config.json:/kaniko/.docker/config.json \
            ${{ vars.KANIKO_IMAGE }} \
            --context /workspace/code \
            --dockerfile /workspace/code/Dockerfile \
            --destination $IMAGE_NAME \
            --tarPath /workspace/image.tar 
            
      - name: Verify image tar was created
        # Gitlab: ls -lah to confirm image.tar exists
        run: ls -lah ${{ github.workspace }}/image.tar
      
      - name: Upload image tar for security scanning
        # GitLab: artifacts: paths: -image.tar (automatic)
        # GitHub: must explicitly upload so security job can download it
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: ${{ github.workspace }}/image.tar
          retention-days: 1