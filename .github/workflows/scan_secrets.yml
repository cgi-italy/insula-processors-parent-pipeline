name: Scan Secrets

# Reusable workflow. Blocks the pipeline when verified secrets are found in code/.
on:
  workflow_call:
    inputs:
      repo_slug:
        # External processor repo (owner/name) to scan. Empty = scan this repo
        # (the legacy PULL model where the caller checks out its own code).
        description: "External repo owner/name to scan; empty scans the caller"
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref of the external repo to scan"
        required: false
        default: ""
        type: string

# Deny GITHUB_TOKEN by default; the job re-grants only contents:read for checkout.
permissions: {}

jobs:
  scan_secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # No continue-on-error: a verified secret must fail the job and block build/publish.
    steps:
      - name: Checkout caller repo
        if: ${{ inputs.repo_slug == '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout external repo
        if: ${{ inputs.repo_slug != '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.ref }}

      - name: Scan code/ for verified secrets with TruffleHog
        # Image is digest-pinned (tag 3.95.8) so a re-pushed tag cannot swap the
        # scanner. Bump the digest by hand; Dependabot does not track inline images.
        # Run the official TruffleHog image in FILESYSTEM mode against code/.
        # The trufflehog action defaults to git-diff mode and, on non-PR events,
        # fails trying to clone file:///tmp - the wrong mode for a tree scan.
        run: |
          set -o pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/scan:ro" \
            trufflesecurity/trufflehog@sha256:d52e62fe0237bf0199cb79f94593051300b0989d9aeab8b431001d9f75e469c1 \
            filesystem /scan \
            --only-verified \
            --fail \
            --no-update | tee -a "$GITHUB_STEP_SUMMARY"
        # --only-verified: only credentials confirmed live (drops noisy unverified hits).
        # --fail: exit non-zero when a verified secret is found -> blocks the pipeline.
        # --no-update: do not self-update at runtime (pinned version).
        # Default filesystem text output already prints "File:" and "Line:" for each
        # finding; tee mirrors it into the job summary. set -o pipefail keeps the
        # TruffleHog exit code through the pipe so a verified secret still blocks.
