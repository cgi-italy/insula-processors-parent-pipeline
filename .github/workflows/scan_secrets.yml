name: Scan Secrets
#Job name in gitlab is scan_secrets -> name in github is scan secrets

on:
  workflow_call: # ← explicitly marks it as reusable
  # no trigger needed in template files
  # GitLab automatically includes them via include:
 
jobs:
  scan_secrets:
    runs-on: ubuntu-latest 
    # ← GitHub runner, equivalent to GitLab's ubuntu-latest
    continue-on-error: true 
    # ← allows the job to fail without failing the entire workflow
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        # ← checks out the repository code so that it can be scanned

      - name: create reports directory
        # when pipeline.yml is built and variables are passed down
        run: mkdir -p security_reports

      - name: Scan for secrets with TruffleHog
      # The path code is from the child pipeline where the docker exists.
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/code:/code \
            ${{ secrets.TRUFFLEHOG_IMAGE }} \
            filesystem /code \
            --log-level=3 \
            --filter-entropy=0.5 \
            > security_reports/trufflehog_report.json 2>&1 || true

      - name: Check for high risk secrets
        run: |
          if grep -q "high" security_reports/trufflehog_report.json; then
            echo "High risk secrets found!"
          fi
      
      - name: Upload scan report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trufflehog-report
          path: security_reports/
          retention-days: 7
          