name: Scan Secrets

# Reusable workflow. Blocks the pipeline when verified secrets are found in code/.
on:
  workflow_call:

jobs:
  scan_secrets:
    runs-on: ubuntu-24.04
    # No continue-on-error: a verified secret must fail the job and block build/publish.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          # TruffleHog diff mode needs full history; also lets it scan the whole tree.

      - name: Scan for verified secrets with TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.8
        with:
          path: ./code
          extra_args: --only-verified
        # --only-verified: only credentials confirmed live (drops noisy unverified hits).
