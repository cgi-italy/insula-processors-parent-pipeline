name: Scan Secrets

# Reusable workflow. Blocks the pipeline when a verified secret is found anywhere in
# the cloned processor repo (the whole checkout, not just code/).
on:
  workflow_call:
    inputs:
      repo_slug:
        description: "External processor repo (owner/name) to scan"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA) of the external repo to scan"
        required: false
        default: ""
        type: string

# Deny GITHUB_TOKEN by default; the job re-grants only contents:read for checkout.
permissions: {}

jobs:
  scan_secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # No continue-on-error: a verified secret must fail the job and block build/publish.
    steps:
      - name: Checkout the processor repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.ref }}

      - name: Scan the cloned repo for verified secrets with TruffleHog
        # Image is digest-pinned (tag 3.95.8) so a re-pushed tag cannot swap the
        # scanner. Bump the digest by hand; Dependabot does not track inline images.
        # Run the official TruffleHog image in FILESYSTEM mode over the whole
        # checkout (GITHUB_WORKSPACE), not just code/, so a secret committed
        # anywhere in the repo still blocks.
        # The trufflehog action defaults to git-diff mode and, on non-PR events,
        # fails trying to clone file:///tmp - the wrong mode for a tree scan.
        run: |
          set -o pipefail
          TH="trufflesecurity/trufflehog@sha256:d52e62fe0237bf0199cb79f94593051300b0989d9aeab8b431001d9f75e469c1"
          # Pull with retries: anonymous Docker Hub pulls are rate-limited per runner
          # egress IP; a throttled pull would otherwise fail an otherwise-clean scan.
          n=0
          until docker pull "$TH"; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "::error::could not pull trufflehog image"; exit 1; }
            sleep $((n*10))
          done
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/scan:ro" \
            "$TH" \
            filesystem /scan \
            --only-verified \
            --fail \
            --no-update | tee -a "$GITHUB_STEP_SUMMARY"
        # --only-verified: only credentials confirmed live (drops noisy unverified hits).
        # --fail: exit non-zero when a verified secret is found -> blocks the pipeline.
        # --no-update: do not self-update at runtime (pinned version).
        # Default filesystem text output already prints "File:" and "Line:" for each
        # finding; tee mirrors it into the job summary. set -o pipefail keeps the
        # TruffleHog exit code through the pipe so a verified secret still blocks.
