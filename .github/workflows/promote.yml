name: Promote to Production
on:
  workflow_call:
jobs:
  get_latest_image:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.get_image.outputs.image_name }}
    steps:
      - name: Get latest image from Harbor
        id: get_image
        run: |
          REPO="${{ github.repository }}"
          APP_NAME="${REPO##*/}"
          RESPONSE=$(curl -s \
            -u '${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}' \
            "https://${{ vars.HARBOR_REGISTRY }}/api/v2.0/projects/${{ vars.HARBOR_PROJECT }}/repositories/test%2F${APP_NAME}/artifacts?sort=-push_time&page=1&page_size=1")
          TAG=$(echo "$RESPONSE" | python3 -c "
import json, sys
data = json.load(sys.stdin)
if not isinstance(data, list) or len(data) == 0:
    print('Harbor API error or empty repo:', data, file=sys.stderr)
    sys.exit(1)
print(data[0]['tags'][0]['name'])
")
          echo "image_name=${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/test/${APP_NAME}:${TAG}" >> $GITHUB_OUTPUT

  publish_image:
    needs: [get_latest_image]
    uses: ./.github/workflows/publish_image.yml
    with:
      image_name: ${{ needs.get_latest_image.outputs.image_name }}
    secrets: inherit
